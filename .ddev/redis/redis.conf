# Redis configuration, based on the official ddev/ddev-redis add-on.
# Reference: http://download.redis.io/redis-stable/redis.conf

maxmemory 2048mb
maxmemory-policy allkeys-lfu

# RDB persistence stays enabled with the Redis image defaults and writes to the
# project's "redis" Docker volume (mounted at /data). To make the service
# strictly cache-only, uncomment the two lines below:
#appendonly no
#save ""

# Novel Forge AI — DDEV nginx site configuration.
#
# This file is DDEV's generated Laravel nginx template
# (pkg/ddevapp/webserver_config_assets/nginx-site-laravel.conf) taken over at
# Step 2, with only the two changes the application requires:
#   1. client_max_body_size 128m   (legacy nginx/php upload limit; media library)
#   2. fastcgi_read_timeout/send_timeout 1800s (long AI generation requests;
#      the application uses a 600s HTTP timeout and set_time_limit(timeout+30),
#      so DDEV's default fastcgi_read_timeout 10m is too short)
# Everything else is kept identical to DDEV's template so behaviour stays
# standard. The DDEV generated-file marker comment is intentionally absent so
# DDEV does not overwrite this file. Consequence: future upstream template
# changes must be merged manually.
# Verify inside the container with: ddev exec nginx -t

server {
    listen 80 default_server;
    listen 443 ssl default_server;

    # DDEV approot is mounted at /var/www/html; the Laravel public directory lives in src/.
    root /var/www/html/src/public;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    include /etc/nginx/monitoring.conf;

    index index.html index.htm index.php;

    charset utf-8;

    client_max_body_size 128m;

    # Disable sendfile as per https://docs.vagrantup.com/v2/synced-folders/virtualbox.html
    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    location / {
        absolute_redirect off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        # Not try_files: it would clear $fastcgi_path_info and empty PATH_INFO.
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_intercept_errors off;
        # Must stay above the PHP request duration (app: 600s + 30s margin).
        fastcgi_read_timeout 1800s;
        fastcgi_send_timeout 1800s;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
        # Pass the X-Accel-* headers to facilitate testing.
        fastcgi_pass_header "X-Accel-Buffering";
        fastcgi_pass_header "X-Accel-Charset";
        fastcgi_pass_header "X-Accel-Expires";
        fastcgi_pass_header "X-Accel-Limit-Rate";
        fastcgi_pass_header "X-Accel-Redirect";
    }

    # Prevent clients from accessing hidden files (starting with a dot)
    # This is particularly important if you store .htpasswd files in the site hierarchy
    # Access to `/.well-known/` is allowed.
    # https://www.mnot.net/blog/2010/04/07/well-known
    # https://tools.ietf.org/html/rfc5785
    location ~* /\.(?!well-known\/) {
        deny all;
    }

    # Prevent clients from accessing to backup/config/source files
    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
    }

    # Fix: File upload over https fails signature verification
    #      https://github.com/livewire/livewire/discussions/3084
    location ^~ /livewire {
        try_files $uri $uri/ /index.php?$args;
    }

    include /mnt/ddev_config/nginx/*.conf;
    include /etc/nginx/common.d/*.conf;
}

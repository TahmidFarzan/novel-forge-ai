; Novel Forge AI — project PHP configuration (single file).
; DDEV copies every .ddev/php/*.ini into the CLI and FPM conf.d directories,
; so these values override the DDEV image defaults without replacing php.ini.

[PHP]
memory_limit = 1024M
max_execution_time = 1800
max_input_time = 1800
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M
max_file_uploads = 50
date.timezone = UTC
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off
allow_url_fopen = On
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.save_comments = 1

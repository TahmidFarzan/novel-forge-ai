services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OLLAMA_VERSION: "${OLLAMA_VERSION:-0.35.1}"
    image: "novel-forge-ai-ollama:${OLLAMA_VERSION:-0.35.1}"
    pull_policy: build
    container_name: "${OLLAMA_CONTAINER_NAME:-novel-forge-ai-ollama}"
    restart: "${OLLAMA_RESTART_POLICY:-unless-stopped}"
    init: true
    ports:
      - "${OLLAMA_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST:-0.0.0.0:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-1}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - inference
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  inference:
    name: novel-forge-ai-net

volumes:
  ollama_data:
    name: novel-forge-ai-ollama-data
